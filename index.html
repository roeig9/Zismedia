<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תזרים מזומנים</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #2d2417;
    --muted: #8a7a63;
    --line: #e8ddc9;
    --bg: #fdf9f1;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p.lead { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
  .toggle-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .toggle-btn {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chart-wrap {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    height: calc(100vh - 110px);
    min-height: 280px;
  }
  .status-msg { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<h1>תזרים מזומנים — הכנסות מול הוצאות</h1>
<p class="lead">מצטבר לפי חודש</p>

<div class="toggle-row">
  <button type="button" class="toggle-btn active" id="btn-cumulative">מצטבר</button>
  <button type="button" class="toggle-btn" id="btn-monthly">חודשי</button>
</div>

<div class="chart-wrap">
  <p class="status-msg" id="status-msg">טוען נתונים…</p>
  <canvas id="cash-flow-canvas" style="display:none"></canvas>
</div>

<script>
  // Point this at your n8n GET webhook's Production URL.
  const DATA_URL = "https://zis-spoton.app.n8n.cloud/webhook/cash-flow";

  let chart = null;
  let DATA = null;

  function render(mode) {
    if (chart) chart.destroy();
    const ctx = document.getElementById("cash-flow-canvas").getContext("2d");
    const incomeData = mode === "cumulative" ? DATA.cumulativeIncome : DATA.monthlyIncome;
    const expenseData = mode === "cumulative" ? DATA.cumulativeExpense : DATA.monthlyExpense;

    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: DATA.labels,
        datasets: [
          {
            label: "הכנסות",
            data: incomeData,
            borderColor: "#0f6e56",
            backgroundColor: "rgba(15, 110, 86, 0.08)",
            fill: mode === "cumulative",
            tension: 0.2,
            pointRadius: 3,
          },
          {
            label: "הוצאות",
            data: expenseData,
            borderColor: "#b3261e",
            backgroundColor: "rgba(179, 38, 30, 0.08)",
            fill: mode === "cumulative",
            tension: 0.2,
            pointRadius: 3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "top", rtl: true },
          tooltip: {
            rtl: true,
            callbacks: {
              label: (item) => item.dataset.label + ': ₪' + item.parsed.y.toLocaleString('he-IL'),
            },
          },
        },
        scales: {
          y: {
            ticks: {
              callback: (val) => '₪' + Number(val).toLocaleString('he-IL'),
            },
          },
        },
      },
    });
  }

  document.getElementById("btn-cumulative").addEventListener("click", (e) => {
    document.querySelectorAll(".toggle-btn").forEach((b) => b.classList.remove("active"));
    e.target.classList.add("active");
    render("cumulative");
  });
  document.getElementById("btn-monthly").addEventListener("click", (e) => {
    document.querySelectorAll(".toggle-btn").forEach((b) => b.classList.remove("active"));
    e.target.classList.add("active");
    render("monthly");
  });

  fetch(DATA_URL)
    .then((res) => {
      if (!res.ok) throw new Error("Request failed");
      return res.json();
    })
    .then((data) => {
      DATA = data;
      document.getElementById("status-msg").style.display = "none";
      document.getElementById("cash-flow-canvas").style.display = "block";
      render("cumulative");
    })
    .catch(() => {
      document.getElementById("status-msg").textContent = "טעינת הנתונים נכשלה.";
    });
</script>
</body>
</html>
