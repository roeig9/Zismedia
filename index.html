<script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTfmfSN0uJd2C-yqz5tXVttSOlv4ik6wjtgUhWQvMSlWj2S4TeLgMJLDdU0NRp9ii5ENunwTXbwR3Qm/pub?output=csv';

    async function loadData() {
        try {
            const response = await fetch(sheetUrl);
            const text = await response.text();
            const rows = text.split('\n').slice(1);
            const tableBody = document.getElementById('table-body');
            
            tableBody.innerHTML = ''; // ניקוי הטבלה

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length > 1) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + cols[0] + '</td><td>' + cols[1] + '</td><td>' + cols[2] + '</td>';
                    tableBody.appendChild(tr);
                }
            });
        } catch (e) {
            console.error('Error:', e);
        }
    }
    loadData();
</script>
